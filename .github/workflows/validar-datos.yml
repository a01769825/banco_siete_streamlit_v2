# Revisa el CSV del tablero contra contrato-datos.md en cada cambio.
# Si el dato no cumple el contrato, la corrida falla (en rojo) y el cambio queda marcado.
name: Validar datos

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install pandas numpy
      - name: Revisar el archivo contra el contrato de datos
        run: python validar_datos.py
